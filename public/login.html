<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>Đăng nhập | E-School AI</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: { DEFAULT: '#09090b', dim: '#0f0f12', bright: '#18181b' },
                        primary: { DEFAULT: '#818cf8', dark: '#6366f1', deeper: '#4f46e5' },
                        muted: '#71717a',
                        border: '#27272a',
                    },
                    fontFamily: {
                        sans: ["'Be Vietnam Pro'", 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <style>
        /* ── Global Reset ── */
        *, *::before, *::after { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }
        html, body { height: 100dvh; overflow: hidden; margin: 0; padding: 0; }
        body { background: #09090b; font-family: 'Be Vietnam Pro', sans-serif; }

        /* ── Ambient Background ── */
        .ambient-orb {
            position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .ambient-orb-1 { width: 600px; height: 600px; top: -20%; left: -10%; background: rgba(99, 102, 241, 0.08); }
        .ambient-orb-2 { width: 500px; height: 500px; bottom: -15%; right: -5%; background: rgba(139, 92, 246, 0.06); animation-delay: -7s; animation-direction: alternate-reverse; }
        @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 60px) scale(1.05); } }

        /* ── Card Surface ── */
        .card-glass {
            background: rgba(15, 15, 18, 0.7);
            backdrop-filter: blur(40px) saturate(1.3);
            -webkit-backdrop-filter: blur(40px) saturate(1.3);
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
        }

        /* ── Inputs ── */
        .field {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            color: #e4e4e7;
            font-size: 14px;
            padding: 12px 16px;
            width: 100%;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            outline: none;
        }
        .field::placeholder { color: #52525b; }
        .field:focus {
            border-color: rgba(129,140,248,0.5);
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        /* ── Pill Tabs ── */
        .tab-pill { position: relative; display: flex; background: rgba(255,255,255,0.04); border-radius: 10px; padding: 3px; }
        .tab-pill .indicator {
            position: absolute; top: 3px; bottom: 3px; border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn {
            position: relative; z-index: 2; flex: 1; padding: 8px 0; font-size: 13px; font-weight: 600;
            color: #a1a1aa; text-align: center; cursor: pointer; border: none; background: none;
            transition: color 0.25s ease;
        }
        .tab-btn.active { color: #fff; }

        /* ── Role Chips ── */
        .role-chip {
            display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 10px;
            font-size: 11px; font-weight: 600; color: #a1a1aa; cursor: pointer;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.25s ease; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .role-chip:hover { border-color: rgba(255,255,255,0.12); color: #d4d4d8; }
        .role-chip.active {
            background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.4); color: #818cf8;
        }
        .role-chip .material-symbols-outlined { font-size: 18px; }

        /* ── Primary Button ── */
        .btn-primary {
            width: 100%; padding: 13px 0; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 8px 24px -4px rgba(99,102,241,0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -4px rgba(99,102,241,0.45); }
        .btn-primary:active { transform: translateY(0) scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; }

        /* ── Helpers ── */
        .hidden-form { display: none !important; }
        .label { font-size: 11px; font-weight: 600; color: #71717a; margin-bottom: 5px; display: block; margin-left: 2px; }
        .alert-box {
            font-size: 13px; padding: 10px 14px; border-radius: 10px; display: none; align-items: center; gap: 8px;
            margin-bottom: 16px;
        }
        .alert-box.show { display: flex; animation: fadeSlide 0.3s ease; }
        .alert-box.err { background: rgba(239,68,68,0.1); color: #fca5a5; border-left: 3px solid #ef4444; }
        .alert-box.ok  { background: rgba(16,185,129,0.1); color: #6ee7b7; border-left: 3px solid #10b981; }
        @keyframes fadeSlide { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }

        .fade-in { animation: fadeIn 0.6s ease-out both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Image Overlay ── */
        .brand-image { position: absolute; inset: 0; object-fit: cover; opacity: 0.25; }
        .brand-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #09090b 10%, transparent 60%, rgba(9,9,11,0.4) 100%); }

        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>

<body class="flex items-center justify-center p-4">
    <!-- Ambient light -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>

    <!-- Main Card -->
    <main class="relative z-10 w-full max-w-[960px] h-[min(92dvh,680px)] grid grid-cols-1 md:grid-cols-2 rounded-2xl overflow-hidden card-glass fade-in">

        <!-- ═══ LEFT: Brand ═══ -->
        <section class="relative hidden md:flex flex-col justify-end p-10 overflow-hidden">
            <img class="brand-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8uriSLFN1e3DUJ1mS5l4p9Nh705oaVKi__qreM6nFh33zg4tSOOlTAeuJO1I2oGVqacHBY623uARANVLs-aQHb_1BcHe1cigC0N67sZjpuOsuVTbwB0UD1Ny-Z1HvT4x6gbkKtGs5oNHSIlxKDfBrnEGgwq8m3-gxE_emnTxJpA25ccKMI_ZghLKE5QYhpdhHX43I0bgmW7Rx55Ppq0Y2SR4438JRCazdB6Ky8Pp64g9jmn0CrD97Bpk3RE3PBVBcsxBfy-6BDnU" alt="" />
            <div class="brand-overlay"></div>

            <div class="relative z-10">
                <div class="flex items-center gap-2.5 mb-8">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-dark to-purple-500 flex items-center justify-center shadow-lg shadow-primary-dark/30">
                        <span class="material-symbols-outlined text-white text-lg" style="font-variation-settings:'FILL' 1,'wght' 400">school</span>
                    </div>
                    <span class="text-white font-bold text-lg tracking-tight">E-School AI</span>
                </div>

                <h1 class="text-4xl font-extrabold text-white leading-[1.1] tracking-tight mb-3">
                    Tương lai của<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary to-purple-400">Giáo dục số.</span>
                </h1>
                <p class="text-zinc-400 text-sm leading-relaxed max-w-[280px]">
                    Khai phá sức mạnh AI trong cá nhân hóa lộ trình học tập và quản lý giáo dục thông minh.
                </p>

                <div class="flex items-center gap-3 mt-8">
                    <div class="flex -space-x-2.5">
                        <div class="w-8 h-8 rounded-full bg-zinc-700 border-2 border-surface"></div>
                        <div class="w-8 h-8 rounded-full bg-zinc-600 border-2 border-surface"></div>
                        <div class="w-8 h-8 rounded-full bg-zinc-500 border-2 border-surface"></div>
                    </div>
                    <span class="text-zinc-500 text-xs font-medium">2,400+ người dùng</span>
                </div>
            </div>
        </section>

        <!-- ═══ RIGHT: Auth Forms ═══ -->
        <section class="flex flex-col justify-center p-8 md:p-10 md:border-l border-white/5 overflow-y-auto overflow-x-hidden">
            <div class="w-full max-w-[340px] mx-auto">

                <!-- Mobile logo -->
                <div class="md:hidden flex items-center justify-center gap-2 mb-8">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-dark to-purple-500 flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-base" style="font-variation-settings:'FILL' 1">school</span>
                    </div>
                    <span class="text-white font-bold text-base tracking-tight">E-School AI</span>
                </div>

                <!-- Tab Switcher -->
                <div class="tab-pill mb-8" id="tab-pill">
                    <div class="indicator" id="tab-indicator" style="left: 3px; width: calc(50% - 3px);"></div>
                    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
                    <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Đăng ký</button>
                </div>

                <!-- Alert -->
                <div id="alert" class="alert-box"></div>

                <!-- Role Selector -->
                <div class="flex gap-2 mb-6" id="role-bar">
                    <button type="button" class="role-chip active" data-role="student" onclick="pickRole('student',this)">
                        <span class="material-symbols-outlined">person</span> Học sinh
                    </button>
                    <button type="button" class="role-chip" data-role="teacher" onclick="pickRole('teacher',this)">
                        <span class="material-symbols-outlined">history_edu</span> Giáo viên
                    </button>
                    <button type="button" class="role-chip" data-role="school" onclick="pickRole('school',this)">
                        <span class="material-symbols-outlined">apartment</span> Trường
                    </button>
                </div>
                <input type="hidden" id="role" value="student">

                <!-- ── LOGIN ── -->
                <form id="form-login" class="space-y-4" onsubmit="doLogin(event)">
                    <div>
                        <label class="label" for="l-user">Tài khoản</label>
                        <input class="field" id="l-user" placeholder="Email hoặc tên đăng nhập" required>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="label mb-0" for="l-pass">Mật khẩu</label>
                            <a href="#" class="text-[11px] text-primary font-semibold hover:text-white transition-colors" onclick="event.preventDefault();openForgot()">Quên mật khẩu?</a>
                        </div>
                        <div class="relative">
                            <input class="field pr-10" id="l-pass" type="password" placeholder="••••••••" required>
                            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-white transition-colors" onclick="togPw('l-pass',this)">
                                <span class="material-symbols-outlined text-lg">visibility</span>
                            </button>
                        </div>
                    </div>
                    <button class="btn-primary mt-2" type="submit" id="login-btn">Đăng nhập</button>
                </form>

                <!-- ── REGISTER ── -->
                <form id="form-register" class="hidden-form space-y-3" onsubmit="doRegister(event)">
                    <div id="name-row">
                        <input class="field" id="r-name" placeholder="Họ và tên">
                    </div>
                    <div>
                        <input class="field" id="r-email" type="email" placeholder="Địa chỉ email" required>
                    </div>
                    <div class="relative">
                        <input class="field pr-10" id="r-pass" type="password" placeholder="Mật khẩu" required>
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-white transition-colors" onclick="togPw('r-pass',this)">
                            <span class="material-symbols-outlined text-lg">visibility</span>
                        </button>
                    </div>
                    <div>
                        <input class="field" id="r-confirm" type="password" placeholder="Nhập lại mật khẩu" required>
                    </div>
                    <button class="btn-primary mt-2" type="submit" id="reg-btn">Tạo tài khoản</button>
                </form>

                <!-- Footer links -->
                <div class="mt-6 flex items-center justify-center gap-4 text-xs text-muted">
                    <a href="/" class="hover:text-white transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">arrow_back</span> Trang chủ
                    </a>
                    <span class="text-border">|</span>
                    <a href="#" class="hover:text-white transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">help</span> Hỗ trợ
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- ═══ Forgot Password Modal ═══ -->
    <div id="forgot-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden-form" style="opacity:0;transition:opacity .3s ease">
        <div class="card-glass w-full max-w-[360px] p-8 rounded-2xl" style="transform:scale(.95);transition:transform .3s ease" id="forgot-card">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-white">Quên mật khẩu</h3>
                <button class="text-muted hover:text-white transition-colors" onclick="closeForgot()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <p class="text-zinc-400 text-sm mb-6">Nhập email đã đăng ký, chúng tôi sẽ gửi link khôi phục.</p>
            <input class="field mb-5" id="f-email" type="email" placeholder="name@school.edu.vn" required>
            <button class="btn-primary" onclick="doForgot()">Gửi yêu cầu</button>
        </div>
    </div>

    <script>
    /* ── Tab switching ── */
    function switchTab(mode) {
        const indicator = document.getElementById('tab-indicator');
        const tl = document.getElementById('tab-login');
        const tr = document.getElementById('tab-register');
        const fl = document.getElementById('form-login');
        const fr = document.getElementById('form-register');

        if (mode === 'login') {
            indicator.style.left = '3px';
            indicator.style.width = 'calc(50% - 3px)';
            tl.classList.add('active'); tr.classList.remove('active');
            fl.classList.remove('hidden-form'); fr.classList.add('hidden-form');
        } else {
            indicator.style.left = '50%';
            indicator.style.width = 'calc(50% - 3px)';
            tr.classList.add('active'); tl.classList.remove('active');
            fr.classList.remove('hidden-form'); fl.classList.add('hidden-form');
        }
        hideAlert();
    }

    /* ── Role selection ── */
    function pickRole(role, btn) {
        document.getElementById('role').value = role;
        document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const nameRow = document.getElementById('name-row');
        if (role === 'school') nameRow.style.display = 'none';
        else nameRow.style.display = '';
    }

    /* ── Toggle password ── */
    function togPw(id, btn) {
        const inp = document.getElementById(id);
        const ico = btn.querySelector('.material-symbols-outlined');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        ico.textContent = inp.type === 'password' ? 'visibility' : 'visibility_off';
    }

    /* ── Alerts ── */
    function showAlert(type, msg) {
        const a = document.getElementById('alert');
        a.className = 'alert-box show ' + (type === 'success' ? 'ok' : 'err');
        a.innerHTML = msg;
    }
    function hideAlert() { const a = document.getElementById('alert'); a.className = 'alert-box'; }

    /* ── Forgot password modal ── */
    function openForgot() {
        const m = document.getElementById('forgot-modal');
        const c = document.getElementById('forgot-card');
        m.classList.remove('hidden-form');
        requestAnimationFrame(() => { m.style.opacity = '1'; c.style.transform = 'scale(1)'; });
    }
    function closeForgot() {
        const m = document.getElementById('forgot-modal');
        const c = document.getElementById('forgot-card');
        m.style.opacity = '0'; c.style.transform = 'scale(.95)';
        setTimeout(() => m.classList.add('hidden-form'), 300);
    }

    /* ── Login ── */
    async function doLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = 'Đang xử lý...';
        try {
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('l-user').value.trim(), password: document.getElementById('l-pass').value })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('isLoggedIn', 'true');
                showAlert('success', 'Đăng nhập thành công!');
                const map = { admin:'/system-admin.html', school:'/school-dashboard.html', teacher:'/teacher-dashboard.html', student:'/student-dashboard.html' };
                setTimeout(() => { window.location.href = map[data.user.role] || '/student-dashboard.html'; }, 600);
            } else {
                showAlert('error', data.message || 'Sai thông tin đăng nhập');
                btn.disabled = false; btn.textContent = orig;
            }
        } catch (err) {
            showAlert('error', 'Không thể kết nối đến máy chủ');
            btn.disabled = false; btn.textContent = orig;
        }
    }

    /* ── Register ── */
    async function doRegister(e) {
        e.preventDefault();
        const pass = document.getElementById('r-pass').value;
        const confirm = document.getElementById('r-confirm').value;
        if (pass !== confirm) return showAlert('error', 'Mật khẩu xác nhận không khớp');

        const btn = document.getElementById('reg-btn');
        btn.disabled = true; btn.textContent = 'Đang xử lý...';
        try {
            const role = document.getElementById('role').value;
            const body = {
                username: document.getElementById('r-email').value,
                email: document.getElementById('r-email').value,
                password: pass, role,
                fullname: document.getElementById('r-name').value || 'User'
            };
            const res = await fetch('/api/register', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                showAlert('success', data.pending ? 'Đã gửi! Chờ Admin phê duyệt.' : 'Đăng ký thành công!');
                setTimeout(() => switchTab('login'), 2000);
            } else {
                showAlert('error', data.message || 'Đăng ký thất bại');
                btn.disabled = false; btn.textContent = 'Tạo tài khoản';
            }
        } catch (err) {
            showAlert('error', 'Không thể kết nối đến máy chủ');
            btn.disabled = false; btn.textContent = 'Tạo tài khoản';
        }
    }

    /* ── Forgot ── */
    async function doForgot() {
        const email = document.getElementById('f-email').value;
        if (!email) return;
        try {
            const res = await fetch('/api/admin/reset-password', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const d = await res.json();
            closeForgot();
            showAlert(d.success ? 'success' : 'error', d.success ? 'Đã gửi email khôi phục!' : (d.message || 'Không tìm thấy tài khoản'));
        } catch { closeForgot(); showAlert('error', 'Lỗi kết nối'); }
    }
    </script>
</body>
</html>
