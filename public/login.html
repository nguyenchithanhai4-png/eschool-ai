<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Đăng nhập | E-School AI</title>
    
    <!-- Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0a0a0c",
                        "primary": "#6366f1",
                        "primary-hover": "#4f46e5",
                        "on-surface": "#e2e8f0",
                        "on-surface-variant": "#94a3b8",
                        "outline": "#334155",
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "1.5rem",
                        "xl": "2rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["'Be Vietnam Pro'", "sans-serif"],
                        "body": ["'Be Vietnam Pro'", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0a0a0c;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }

        .mesh-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-color: #0a0a0c;
            background-image: 
                radial-gradient(at 0% 0%, hsla(242, 82%, 24%, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(263, 70%, 20%, 0.1) 0px, transparent 50%);
            filter: blur(80px);
        }

        .blob {
            position: absolute; width: 400px; height: 400px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border-radius: 50%; filter: blur(100px);
            animation: move 25s infinite alternate ease-in-out; pointer-events: none;
        }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(50px, 100px); } }

        .glass-pillar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .liquid-glass {
            background: rgba(15, 17, 23, 0.4);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Hide scrollbars */
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; }

        .spotlight-input {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .spotlight-input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 30px -10px rgba(99, 102, 241, 0.2);
        }

        .auth-tab {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: rgba(255,255,255,0.5);
            font-weight: 600;
        }
        .auth-tab.active {
            background: #6366f1;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .role-icon-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .role-icon-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: #6366f1;
            color: #6366f1;
        }

        .form-hidden { display: none !important; }
        .alert {
            padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px;
            display: none; align-items: center; gap: 10px; border-left: 3px solid transparent;
        }
        .alert.show { display: flex; }
        .alert-error { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: #ef4444; }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border-color: #10b981; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>

<body>
    <div class="mesh-gradient"></div>
    <div class="blob" style="top: -10%; left: -5%;"></div>
    <div class="blob" style="bottom: -10%; right: -5%;"></div>

    <main class="w-full max-w-4xl h-[min(95dvh,710px)] grid grid-cols-1 md:grid-cols-2 gap-0 overflow-hidden rounded-xl liquid-glass animate-fade-in relative z-10">
        <!-- Brand Section -->
        <section class="relative hidden md:flex flex-col justify-end p-12 overflow-hidden border-r border-white/5">
            <div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent z-10"></div>
            <img class="absolute inset-0 w-full h-full object-cover grayscale opacity-30" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8uriSLFN1e3DUJ1mS5l4p9Nh705oaVKi__qreM6nFh33zg4tSOOlTAeuJO1I2oGVqacHBY623uARANVLs-aQHb_1BcHe1cigC0N67sZjpuOsuVTbwB0UD1Ny-Z1HvT4x6gbkKtGs5oNHSIlxKDfBrnEGgwq8m3-gxE_emnTxJpA25ccKMI_ZghLKE5QYhpdhHX43I0bgmW7Rx55Ppq0Y2SR4438JRCazdB6Ky8Pp64g9jmn0CrD97Bpk3RE3PBVBcsxBfy-6BDnU" />
            
            <div class="relative z-20">
                <div class="flex items-center gap-2 mb-8">
                    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-xl">school</span>
                    </div>
                    <span class="text-xl font-black tracking-tighter text-white">E-School AI</span>
                </div>
                <h1 class="text-4xl lg:text-5xl font-black tracking-tight text-white leading-none mb-4">
                    Kiến tạo <br />
                    <span class="text-on-surface-variant font-light">Tương lai.</span>
                </h1>
                <p class="text-on-surface-variant text-sm font-medium leading-relaxed max-w-[280px]">
                    Hệ sinh thái giáo dục thông minh ứng dụng AI hàng đầu.
                </p>
            </div>
        </section>

        <!-- Form Section -->
        <section class="p-8 md:p-10 flex flex-col items-center justify-center relative overflow-y-auto overflow-x-hidden">
            <div class="w-full max-w-[320px]">
                <!-- Auth Switcher -->
                <div class="flex bg-white/5 p-1 rounded-full mb-8">
                    <button class="auth-tab flex-1 py-2 text-xs rounded-full active" id="tab-login" onclick="switchAuth('login')">Đăng nhập</button>
                    <button class="auth-tab flex-1 py-2 text-xs rounded-full" id="tab-register" onclick="switchAuth('register')">Đăng ký</button>
                </div>

                <div id="alert" class="alert"></div>

                <!-- Role Selector -->
                <div class="flex justify-center gap-4 mb-8">
                    <button class="role-icon-btn w-12 h-12 rounded-xl flex items-center justify-center active" data-role="student" title="Học sinh" onclick="selectRole('student', this)">
                        <span class="material-symbols-outlined">person</span>
                    </button>
                    <button class="role-icon-btn w-12 h-12 rounded-xl flex items-center justify-center" data-role="teacher" title="Giáo viên" onclick="selectRole('teacher', this)">
                        <span class="material-symbols-outlined">history_edu</span>
                    </button>
                    <button class="role-icon-btn w-12 h-12 rounded-xl flex items-center justify-center" data-role="school" title="Trường học" onclick="selectRole('school', this)">
                        <span class="material-symbols-outlined">apartment</span>
                    </button>
                </div>
                <input type="hidden" id="selected-role" value="student">

                <!-- Forms -->
                <div class="space-y-4">
                    <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-on-surface-variant ml-1">Tài khoản</label>
                            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none" id="login-user" placeholder="Email / Tên đăng nhập" required />
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between px-1">
                                <label class="text-[10px] uppercase font-bold text-on-surface-variant">Mật khẩu</label>
                                <a href="#" class="text-[10px] text-primary font-bold hover:text-white" onclick="showForgot()">Quên?</a>
                            </div>
                            <div class="relative">
                                <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none pr-10" id="login-pass" type="password" placeholder="••••••••" required />
                                <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-white" onclick="togglePass('login-pass', this)">
                                    <span class="material-symbols-outlined text-lg">visibility</span>
                                </button>
                            </div>
                        </div>
                        <button class="w-full bg-primary hover:bg-primary-hover text-white font-black py-3 rounded-full shadow-lg shadow-primary/20 transition-all mt-4" type="submit" id="login-btn">
                            ĐĂNG NHẬP
                        </button>
                    </form>

                    <form id="register-form" class="space-y-3 form-hidden" onsubmit="handleRegister(event)">
                        <div id="name-field" class="space-y-1">
                            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none" id="reg-name" placeholder="Họ và tên" />
                        </div>
                        <div class="space-y-1">
                            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none" id="reg-email" placeholder="Địa chỉ Email" type="email" required />
                        </div>
                        <div class="space-y-1">
                            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none" id="reg-pass" type="password" placeholder="Mật khẩu" required />
                        </div>
                        <div class="space-y-1">
                            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white focus:outline-none" id="reg-confirm" type="password" placeholder="Xác nhận mật khẩu" required />
                        </div>
                        <button class="w-full bg-primary hover:bg-primary-hover text-white font-black py-3 rounded-full transition-all mt-4" type="submit" id="reg-btn">
                            TẠO TÀI KHOẢN
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Forgot -->
    <div id="modal-forgot" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 form-hidden opacity-0 transition-opacity">
        <div class="liquid-glass w-full max-w-[320px] p-8 rounded-2xl border border-white/10">
            <h3 class="text-xl font-bold text-white mb-2">Quên mật khẩu?</h3>
            <p class="text-on-surface-variant text-xs mb-6">Nhập email để nhận link khôi phục.</p>
            <input class="w-full spotlight-input rounded-xl py-3 px-4 text-sm text-white mb-6 focus:outline-none" id="forgot-email" placeholder="name@school.edu.vn" type="email" />
            <div class="flex gap-3">
                <button class="flex-1 py-3 text-xs font-bold text-on-surface-variant" onclick="closeForgot()">Hủy</button>
                <button class="flex-1 bg-white text-surface py-3 text-xs font-bold rounded-full" onclick="handleForgot()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        function switchAuth(mode) {
            document.getElementById('login-form').classList.toggle('form-hidden', mode === 'register');
            document.getElementById('register-form').classList.toggle('form-hidden', mode === 'login');
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('alert').classList.remove('show');
        }

        function selectRole(role, btn) {
            document.getElementById('selected-role').value = role;
            document.querySelectorAll('.role-icon-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('name-field').classList.toggle('form-hidden', role === 'school');
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('span');
            input.type = input.type === 'password' ? 'text' : 'password';
            icon.textContent = input.type === 'password' ? 'visibility' : 'visibility_off';
        }

        function showForgot() { const m = document.getElementById('modal-forgot'); m.classList.remove('form-hidden'); setTimeout(() => m.classList.replace('opacity-0', 'opacity-100'), 10); }
        function closeForgot() { const m = document.getElementById('modal-forgot'); m.classList.replace('opacity-100', 'opacity-0'); setTimeout(() => m.classList.add('form-hidden'), 300); }

        function alertMsg(type, msg) { const a = document.getElementById('alert'); a.className = `alert alert-${type} show`; a.innerHTML = `<span>${msg}</span>`; }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const orig = btn.innerText; btn.innerText = '...'; btn.disabled = true;
            try {
                const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value })});
                const data = await res.json();
                if(data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user)); localStorage.setItem('isLoggedIn', 'true');
                    const rMap = { admin: '/system-admin.html', school: '/school-dashboard.html', teacher: '/teacher-dashboard.html', student: '/student-dashboard.html' };
                    window.location.href = rMap[data.user.role] || '/student-dashboard.html';
                } else { alertMsg('error', data.message); btn.innerText = orig; btn.disabled = false; }
            } catch(e) { alertMsg('error', 'Lỗi kết nối'); btn.innerText = orig; btn.disabled = false; }
        }

        async function handleRegister(e) {
            e.preventDefault();
            if(document.getElementById('reg-pass').value !== document.getElementById('reg-confirm').value) return alertMsg('error', 'Mật khẩu không khớp');
            const btn = document.getElementById('reg-btn'); btn.disabled = true;
            try {
                const body = { username: document.getElementById('reg-email').value, email: document.getElementById('reg-email').value, password: document.getElementById('reg-pass').value, role: document.getElementById('selected-role').value, fullname: document.getElementById('reg-name').value || 'User' };
                const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
                const data = await res.json();
                if(data.success) { alertMsg('success', data.pending ? 'Chờ phê duyệt' : 'Thành công!'); setTimeout(() => switchAuth('login'), 2000); }
                else { alertMsg('error', data.message); btn.disabled = false; }
            } catch(e) { alertMsg('error', 'Lỗi hệ thống'); btn.disabled = false; }
        }
    </script>
</body>

</html>
